name: TPA
version: '${version}'
main: top.craft_hello.tpa.TPA
description: 一个支持 Folia 的简易传送插件，兼容 Spigot/Paper 1.8.8+ 与 Folia
author: WarSkyGod
website: https://github.com/WarSkyGod/TPA
folia-supported: true

# 可选依赖：PlaceholderAPI 存在时提供 %tpa_*% 占位符；
# Vault/PlayerPoints 存在时提供传送费用货币支持（金钱/点券）；
# Floodgate 存在时基岩玩家使用弹窗按钮交互。
# 注意：Floodgate 插件注册名为小写 "floodgate"，依赖名必须与其一致
softdepend: [PlaceholderAPI, Vault, PlayerPoints, floodgate]

# 命令执行统一入口为 LegacyCommandRouter（兼容 1.8.8+）；
# 在 Paper 1.20.6+ 上会改为 Brigadier 注册，并从 CommandMap 移除这里的同名声明避免重复
commands:
  tpa:
    description: 请求传送到指定玩家的位置
    usage: /tpa <玩家>
  tphere:
    description: 请求指定玩家传送到你的位置
    usage: /tphere <玩家>
  tpaccept:
    description: 接受传送请求
    usage: /tpaccept [玩家]
  tpdeny:
    description: 拒绝传送请求
    usage: /tpdeny [玩家]
  tpall:
    description: 将在线玩家传送到指定位置
    usage: /tpall [player|warp|spawn] [名称]
  tplogout:
    description: 传送到玩家最后下线的位置
    usage: /tplogout <玩家>
  rtp:
    description: 随机传送
    usage: /rtp
  back:
    description: 返回上一次的位置
    usage: /back
  denys:
    description: 管理黑名单
    usage: /denys [add|remove] [玩家]
  tpac:
    description: 插件管理命令
    usage: /tpac [version/setlang/reload]
  warp:
    description: 传送到传送点
    usage: /warp [名称]
  setwarp:
    description: 在当前位置设置传送点
    usage: /setwarp <名称>
  delwarp:
    description: 删除传送点
    usage: /delwarp <名称>
  home:
    description: 传送到家
    usage: /home [名称]
  homes:
    description: 查看家列表
    usage: /homes
  sethome:
    description: 在当前位置设置家
    usage: /sethome [名称]
  setdefaulthome:
    description: 设置默认家
    usage: /setdefaulthome <名称>
  delhome:
    description: 删除家
    usage: /delhome <名称>
  spawn:
    description: 传送到主城
    usage: /spawn
  setspawn:
    description: 设置主城位置
    usage: /setspawn
  delspawn:
    description: 删除主城位置
    usage: /delspawn

permissions:
  tpa.admin:
    default: op
    description: "最高权限，可执行所有操作"
  tpa.reload:
    default: op
    description: "可使用 /tpac reload 命令重新加载配置文件"
  tpa.version:
    default: op
    description: "拥有这个权限的玩家会收到插件更新通知，可使用 /tpac version 来检查插件更新"
  tpa.nodelay:
    default: false
    description: "拥有这个权限的玩家传送将不受命令使用后的等待时间限制"
  tpa.setwarp:
    default: op
    description: "可使用 /setwarp 命令设置传送点"
  tpa.delwarp:
    default: op
    description: "可使用 /delwarp 命令删除传送点"
  tpa.setspawn:
    default: op
    description: "可使用 /setspawn 命令设置主城"
  tpa.delspawn:
    default: op
    description: "可使用 /delspawn 命令删除主城"
  tpa.tpall:
    default: op
    description: "可使用 /tpall 命令强行将所有在线玩家传送到你的位置"
  tpa.tplogout:
    default: op
    description: "可使用 /tplogout 传送到玩家最后的下线位置"
  tpa.tpa:
    default: false
    description: "可使用 /tpa 命令请求传送到指定玩家的位置（默认关闭权限检查）"
  tpa.tphere:
    default: false
    description: "可使用 /tphere 命令请求指定玩家传送到你的位置（默认关闭权限检查）"
  tpa.rtp:
    default: false
    description: "可使用 /rtp 命令随机在一定范围内传送（默认关闭权限检查）"
  tpa.denys:
    default: false
    description: "可使用 /denys 管理黑名单"
  tpa.warp:
    default: false
    description: "可使用 /warp 命令传送到传送点（默认关闭权限检查）"
  tpa.home:
    default: false
    description: "可使用 `/home`、`/homes`、`/sethome`、`/setdefaulthome`、`/delhome`（默认关闭权限检查）"
  tpa.default:
    default: true
    description: "可在配置文件中设置拥有该权限的玩家最多可以设置多少个家（-1 为不限制），以及付费传送优惠（如果开启）"
  tpa.vip:
    default: false
    description: "可在配置文件中设置拥有该权限的玩家最多可以设置多少个家（-1 为不限制），以及付费传送优惠（如果开启）"
  tpa.vip+:
    default: false
    description: "可在配置文件中设置拥有该权限的玩家最多可以设置多少个家（-1 为不限制），以及付费传送优惠（如果开启）"
  tpa.mvp:
    default: false
    description: "可在配置文件中设置拥有该权限的玩家最多可以设置多少个家（-1 为不限制），以及付费传送优惠（如果开启）"
  tpa.mvp+:
    default: false
    description: "可在配置文件中设置拥有该权限的玩家最多可以设置多少个家（-1 为不限制），以及付费传送优惠（如果开启）"
  tpa.mvp++:
    default: false
    description: "可在配置文件中设置拥有该权限的玩家最多可以设置多少个家（-1 为不限制），以及付费传送优惠（如果开启）"
  tpa.spawn:
    default: false
    description: "可使用 /spawn 命令传送到主城（默认关闭权限检查）"
  tpa.back:
    default: false
    description: "可使用 /back 命令传送到上一次的位置（默认关闭权限检查）"
