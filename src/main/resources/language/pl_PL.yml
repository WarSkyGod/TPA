# Interakcje przycisków
#=======================
## Tekst przycisków
accept_button: "<bold><green><click:run_command:/tpaccept><insert:/tpaccept><hover:show_text:'<green><bold>Kliknij aby zaakceptować teleportację</bold><red>'>[Akceptuj]</hover></insert></click></green>  </bold>"
deny_button: "<bold><red><click:run_command:/tpdeny><insert:/tpdeny><hover:show_text:'<red><bold>Kliknij aby odrzucić teleportację</bold><red>'>[Odrzuć]</hover></insert></click></red>  </bold>"
blacklist.add_button: "<bold><red><click:run_command:/denys add %target%><insert:/denys add %target%><hover:show_text:'<red><bold>Kliknij aby zablokować i odrzucić</bold><red>'>[Zablokuj i odrzuć]</hover></insert></click></red>  </bold>"
blacklist.remove_button: "<bold><green><click:run_command:/denys remove %target%><insert:/denys remove %target%><hover:show_text:'<green><bold>Kliknij aby odblokować gracza</bold></green>'>[Odblokuj]</hover></insert></click></green>  </bold>"
teleport_button: "<bold><green><click:run_command:/%command% %target%><insert:/%command% %target%><hover:show_text:'<green><bold>Kliknij aby się teleportować</bold></green>'>[Teleportuj]</hover></insert></click></green>  </bold>"
location_set_button: "<bold><gold><click:run_command:/set%command% %target%><insert:/set%command% %target%><hover:show_text:'<gold><bold>Kliknij aby ustawić obecną lokalizację</bold></gold>'>[Ustaw lokalizację]</hover></insert></click></gold>  </bold>"
default_home_set_button: "<bold><yellow><click:run_command:/setdefaulthome %target%><insert:/setdefaulthome %target%><hover:show_text:'<yellow><bold>Kliknij aby ustawić dom domyślny</bold></yellow>'>[Ustaw dom domyślny]</hover></insert></click></yellow>  </bold>"
delete_button: "<bold><red><click:run_command:/del%command% %target%><insert:/del%command% %target%><hover:show_text:'<red><bold>Kliknij aby usunąć</bold><red>'>[Usuń]</hover></insert></click></red>  </bold>"

